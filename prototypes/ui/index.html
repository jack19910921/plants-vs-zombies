<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玩具桌面植物小队 UI Prototype</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ffd34f' d='M32 4l7 19h20L43 35l6 20-17-12-17 12 6-20L5 23h20z'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #263238;
        --muted: #5f6d73;
        --paper: #fff8df;
        --paper-strong: #fff0b8;
        --wood: #eebf7a;
        --wood-line: #d99d55;
        --track: #8bd4bd;
        --track-alt: #b8e07d;
        --leaf: #2f9c5d;
        --leaf-dark: #197248;
        --star: #ffd34f;
        --bubble: #67b7e8;
        --tomato: #f45f4f;
        --purple: #8975d6;
        --orange: #f19b38;
        --shadow: rgba(39, 54, 62, 0.22);
        --line: rgba(38, 50, 56, 0.18);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
        background:
          linear-gradient(90deg, rgba(217, 157, 85, 0.18) 1px, transparent 1px) 0 0 / 42px 100%,
          #eec37f;
        color: var(--ink);
        font-family:
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }

      button {
        font: inherit;
      }

      .prototype {
        width: min(1180px, calc((100vh - 86px) * 16 / 9), 100%);
      }

      .app-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        min-height: 560px;
        overflow: hidden;
        border: 5px solid #7b5737;
        border-radius: 8px;
        background:
          linear-gradient(0deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)),
          repeating-linear-gradient(90deg, var(--wood), var(--wood) 82px, var(--wood-line) 83px, var(--wood) 88px);
        box-shadow: 0 24px 55px rgba(65, 42, 21, 0.32);
      }

      .scene3d {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.72;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
        perspective: 900px;
        transform-style: preserve-3d;
      }

      .scene3d-board {
        position: absolute;
        right: 4%;
        top: 8%;
        width: 54%;
        height: 78%;
        border: 4px solid rgba(92, 67, 48, 0.62);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.22) 1px, transparent 1px) 0 0 / 64px 100%,
          rgba(247, 214, 151, 0.58);
        box-shadow: 0 32px 24px rgba(72, 48, 24, 0.18);
        transform: rotateX(54deg) rotateZ(-1.5deg) translateY(28px);
        transform-origin: center bottom;
        animation: scene-sway 7s ease-in-out infinite;
      }

      .scene3d-lane {
        position: absolute;
        left: 12%;
        right: 10%;
        height: 12%;
        border: 2px solid rgba(38, 50, 56, 0.16);
        border-radius: 8px;
        background: rgba(126, 210, 184, 0.78);
        box-shadow: 0 8px 0 rgba(38, 50, 56, 0.08);
      }

      .scene3d-lane:nth-child(1) {
        top: 13%;
      }

      .scene3d-lane:nth-child(2) {
        top: 29%;
        background: rgba(245, 223, 117, 0.82);
      }

      .scene3d-lane:nth-child(3) {
        top: 45%;
        background: rgba(148, 216, 124, 0.8);
      }

      .scene3d-lane:nth-child(4) {
        top: 61%;
        background: rgba(145, 212, 238, 0.8);
      }

      .scene3d-lane:nth-child(5) {
        top: 77%;
        background: rgba(246, 164, 155, 0.82);
      }

      .scene3d-base {
        position: absolute;
        left: 5%;
        top: 34%;
        width: 8%;
        height: 34%;
        border: 3px solid rgba(92, 67, 48, 0.68);
        border-radius: 8px;
        background: rgba(255, 240, 184, 0.9);
        box-shadow: 0 10px 0 rgba(92, 67, 48, 0.16);
      }

      .scene3d-token {
        position: absolute;
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 3px solid rgba(38, 50, 56, 0.68);
        border-radius: 50%;
        background: #ffd34f;
        color: #263238;
        font-weight: 900;
        font-size: 22px;
        box-shadow: 0 12px 10px rgba(36, 45, 40, 0.18);
        transform: translateZ(58px);
        animation: scene-token-bob 3.6s ease-in-out infinite;
      }

      .scene3d-token.pea {
        left: 35%;
        top: 53%;
        background: #58bd6d;
      }

      .scene3d-token.sunflower {
        left: 26%;
        top: 31%;
        background: #ffd45c;
      }

      .scene3d-token.cone {
        right: 22%;
        top: 43%;
        background: #f08a24;
      }

      .scene3d-token.bucket {
        right: 16%;
        top: 70%;
        background: #aeb7bb;
      }

      .scene3d-token.sun {
        width: 38px;
        height: 38px;
        border-color: #a46a19;
        background:
          radial-gradient(circle at 34% 28%, #fff7b7 0 14%, transparent 15%),
          radial-gradient(circle, #ffd86a 0 56%, #f6a735 57% 100%);
        animation: scene-sun-float 4.8s ease-in-out infinite;
      }

      .scene3d-token.sun.one {
        left: 68%;
        top: 22%;
      }

      .scene3d-token.sun.two {
        left: 75%;
        top: 66%;
        animation-delay: -1.5s;
      }

      .app-frame::before {
        content: "";
        position: absolute;
        inset: 18px;
        border: 2px dashed rgba(123, 87, 55, 0.32);
        pointer-events: none;
        z-index: 2;
      }

      .screen {
        position: absolute;
        inset: 0;
        display: none;
        padding: 34px;
        z-index: 1;
      }

      .screen.is-active {
        display: block;
      }

      .toy-title {
        margin: 0;
        color: #174a36;
        font-size: clamp(34px, 5vw, 64px);
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: 0;
        text-shadow:
          0 4px 0 #ffe08a,
          0 8px 18px rgba(52, 39, 20, 0.16);
      }

      .small-label {
        color: var(--muted);
        font-size: 16px;
        font-weight: 800;
      }

      .menu-screen {
        display: none;
        grid-template-columns: minmax(310px, 430px) 1fr;
        gap: 28px;
        align-items: stretch;
      }

      .menu-screen.is-active {
        display: grid;
      }

      .menu-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
        max-width: 430px;
      }

      .menu-actions {
        display: grid;
        gap: 12px;
        width: min(330px, 100%);
      }

      .toy-button {
        min-height: 56px;
        border: 3px solid #5c4330;
        border-radius: var(--radius);
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 6px 0 #b6864c, 0 12px 18px rgba(74, 47, 25, 0.18);
        cursor: pointer;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0;
      }

      .toy-button:hover {
        transform: translateY(-1px);
      }

      .toy-button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 #b6864c, 0 6px 12px rgba(74, 47, 25, 0.14);
      }

      .toy-button.primary {
        background: var(--star);
      }

      .toy-button.secondary {
        background: #dff3ff;
      }

      .toy-button.danger {
        background: #ffd9d2;
      }

      .table-preview {
        position: relative;
        min-height: 460px;
        border-radius: 8px;
        border: 4px solid rgba(92, 67, 48, 0.78);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px) 0 0 / 74px 100%,
          #f6d28e;
        overflow: hidden;
      }

      .table-preview .track {
        position: absolute;
        left: 11%;
        right: 10%;
        height: 54px;
        border-radius: 8px;
        border: 2px solid rgba(38, 50, 56, 0.18);
        background: var(--track);
      }

      .table-preview .track:nth-child(1) {
        top: 15%;
      }

      .table-preview .track:nth-child(2) {
        top: 30%;
        background: #f7df76;
      }

      .table-preview .track:nth-child(3) {
        top: 45%;
        background: #9bd887;
      }

      .table-preview .track:nth-child(4) {
        top: 60%;
        background: #9fd7ef;
      }

      .table-preview .track:nth-child(5) {
        top: 75%;
        background: #f8b1a7;
      }

      .toy-base {
        position: absolute;
        left: 20px;
        top: 50%;
        width: 72px;
        height: 220px;
        transform: translateY(-50%);
        border-radius: 8px;
        border: 3px solid #5c4330;
        background: #fff0b8;
        box-shadow: 0 8px 0 rgba(92, 67, 48, 0.18);
      }

      .toy-base::before,
      .toy-base::after {
        content: "";
        position: absolute;
        left: 14px;
        width: 38px;
        height: 38px;
        border-radius: 6px;
        background: var(--star);
        border: 2px solid #5c4330;
      }

      .toy-base::before {
        top: 28px;
      }

      .toy-base::after {
        bottom: 28px;
        background: #9bd887;
      }

      .mini-plant,
      .mini-zombie {
        position: absolute;
        width: 54px;
        height: 54px;
        border: 3px solid #35513f;
        border-radius: 50%;
        box-shadow: 0 5px 0 rgba(38, 50, 56, 0.16);
      }

      .mini-plant {
        background: #55bd70;
      }

      .mini-plant::before {
        content: "";
        position: absolute;
        right: -20px;
        top: 17px;
        width: 25px;
        height: 18px;
        border-radius: 50%;
        background: #9ae17c;
        border: 2px solid #35513f;
      }

      .mini-plant.sunflower {
        background:
          radial-gradient(circle, #6f4a24 0 42%, transparent 43%),
          repeating-conic-gradient(#ffd45c 0 16deg, #f4a83a 16deg 32deg);
        border-color: #5b3d1f;
      }

      .mini-plant.sunflower::before {
        content: none;
      }

      .mini-plant.peashooter {
        background: #57b96b;
      }

      .mini-zombie {
        background: #b4c4c0;
        border-radius: 8px;
        border-color: #485956;
      }

      .mini-zombie::before {
        content: "";
        position: absolute;
        left: 9px;
        top: 12px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #263238;
        box-shadow: 22px 0 0 #263238;
      }

      .mini-plant.one {
        left: 22%;
        top: 30%;
      }

      .mini-plant.two {
        left: 33%;
        top: 60%;
        background: var(--bubble);
      }

      .mini-zombie.one {
        right: 20%;
        top: 45%;
      }

      .mini-zombie.two {
        right: 13%;
        top: 75%;
        background: #d7c1a3;
      }

      .mini-zombie.cone::after,
      .mini-zombie.bucket::after {
        content: "";
        position: absolute;
        left: 10px;
        top: -22px;
        width: 30px;
        height: 26px;
        border: 3px solid #5c4330;
      }

      .mini-zombie.cone::after {
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        background: #f08a24;
      }

      .mini-zombie.bucket::after {
        border-radius: 5px 5px 2px 2px;
        background: #9fa9ad;
      }

      .star-sticker {
        position: absolute;
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        color: #7b5737;
        font-size: 30px;
        font-weight: 900;
        transform: rotate(-10deg);
      }

      .star-sticker::before {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 28%, #fff7b7 0 14%, transparent 15%),
          radial-gradient(circle, #ffd86a 0 56%, #f6a735 57% 100%);
        border: 2px solid #a46a19;
        box-shadow: 0 0 0 5px rgba(255, 211, 79, 0.25);
      }

      .star-sticker span {
        position: relative;
      }

      .screen-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }

      .screen-title {
        margin: 0;
        font-size: 34px;
        line-height: 1.1;
        font-weight: 900;
      }

      .icon-button {
        width: 52px;
        height: 52px;
        border: 3px solid #5c4330;
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: 0 5px 0 #b6864c;
        cursor: pointer;
        font-size: 24px;
        font-weight: 900;
      }

      .level-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }

      .level-card {
        min-height: 360px;
        display: grid;
        align-content: space-between;
        gap: 18px;
        padding: 20px;
        border: 4px solid #5c4330;
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: 0 10px 0 rgba(92, 67, 48, 0.18);
      }

      .level-art {
        height: 155px;
        position: relative;
        overflow: hidden;
        border: 3px solid rgba(92, 67, 48, 0.72);
        border-radius: var(--radius);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.28) 1px, transparent 1px) 0 0 / 48px 100%,
          #f3cd84;
      }

      .level-art::before,
      .level-art::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        height: 24px;
        border-radius: 6px;
        background: var(--track);
        border: 2px solid var(--line);
      }

      .level-art::before {
        top: 38px;
      }

      .level-art::after {
        bottom: 38px;
        background: var(--track-alt);
      }

      .level-card h2 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .level-card p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
      }

      .settings-grid {
        display: grid;
        grid-template-columns: minmax(320px, 520px) 1fr;
        gap: 22px;
      }

      .settings-panel {
        display: grid;
        gap: 22px;
        padding: 22px;
        border: 4px solid #5c4330;
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: 0 10px 0 rgba(92, 67, 48, 0.18);
      }

      .setting-row {
        display: grid;
        gap: 10px;
      }

      .setting-row strong {
        font-size: 20px;
      }

      .segments {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 8px;
      }

      .segment {
        min-height: 46px;
        border: 3px solid #5c4330;
        border-radius: var(--radius);
        background: #f7f1d6;
        cursor: pointer;
        font-size: 18px;
        font-weight: 900;
      }

      .segment.is-selected {
        background: var(--star);
        box-shadow: inset 0 -5px 0 rgba(92, 67, 48, 0.14);
      }

      .settings-note {
        display: grid;
        align-content: center;
        min-height: 280px;
        padding: 22px;
        border-radius: var(--radius);
        background: rgba(255, 248, 223, 0.58);
        border: 3px dashed rgba(92, 67, 48, 0.45);
      }

      .settings-note h2 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      .settings-note p {
        margin: 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      .game-screen {
        padding: 18px;
      }

      .game-screen.is-active {
        display: grid;
      }

      .game-layout {
        position: relative;
        display: grid;
        grid-template-rows: 64px 1fr 116px;
        height: 100%;
        gap: 12px;
        perspective: 1100px;
      }

      .hud-top {
        display: grid;
        grid-template-columns: 220px 1fr 64px;
        align-items: center;
        gap: 12px;
        z-index: 2;
      }

      .hud-chip {
        min-height: 54px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border: 3px solid #5c4330;
        border-radius: var(--radius);
        background: var(--paper);
        box-shadow: 0 5px 0 rgba(92, 67, 48, 0.18);
        font-size: 20px;
        font-weight: 900;
      }

      .hud-chip.center {
        justify-content: center;
      }

      .star-icon {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 34% 28%, #fff7b7 0 14%, transparent 15%),
          radial-gradient(circle, #ffd86a 0 52%, #f6a735 53% 100%);
        border: 2px solid #a46a19;
        box-shadow: 0 0 0 3px rgba(255, 211, 79, 0.28);
      }

      .board {
        position: relative;
        display: grid;
        grid-template-rows: repeat(5, 1fr);
        gap: 8px;
        padding: 10px 18px 10px 94px;
        overflow: hidden;
        border: 4px solid #7b5737;
        border-radius: var(--radius);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px) 0 0 / 76px 100%,
          rgba(245, 207, 140, 0.9);
        transform: rotateX(2.5deg);
        transform-origin: center bottom;
      }

      .board-base {
        position: absolute;
        left: 12px;
        top: 50%;
        width: 68px;
        height: 86%;
        transform: translateY(-50%);
        border: 3px solid #5c4330;
        border-radius: var(--radius);
        background: #fff0b8;
        box-shadow: 4px 0 0 rgba(92, 67, 48, 0.16);
      }

      .board-base::before {
        content: "基地";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(-90deg);
        font-weight: 900;
        font-size: 22px;
        white-space: nowrap;
      }

      .lane {
        position: relative;
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 7px;
        min-height: 70px;
        border-radius: 8px;
        background: var(--track);
        border: 2px solid rgba(38, 50, 56, 0.18);
      }

      .lane:nth-child(3) {
        background: #f7df76;
      }

      .lane:nth-child(4) {
        background: #9bd887;
      }

      .lane:nth-child(5) {
        background: #9fd7ef;
      }

      .lane:nth-child(6) {
        background: #f8b1a7;
      }

      .cell {
        min-width: 0;
        border-left: 1px dashed rgba(38, 50, 56, 0.22);
      }

      .cell:first-child {
        border-left: 0;
      }

      .plant-piece,
      .hero-piece,
      .zombie-piece {
        position: absolute;
        z-index: 1;
        display: grid;
        place-items: center;
        color: #163622;
        font-weight: 900;
        box-shadow: 0 5px 0 rgba(38, 50, 56, 0.18);
      }

      .has-asset {
        border-color: rgba(33, 45, 40, 0.72);
        background: rgba(255, 248, 223, 0.26);
        backdrop-filter: blur(1px);
      }

      .has-asset::before,
      .has-asset::after {
        content: none !important;
      }

      .asset-sprite {
        width: 104%;
        height: 104%;
        object-fit: contain;
        pointer-events: none;
        filter: drop-shadow(0 5px 2px rgba(29, 39, 34, 0.2));
        transform: translateY(-2px) translateZ(0);
        animation: sprite-bob 3.2s ease-in-out infinite;
      }

      .zombie-piece.has-asset .asset-sprite {
        width: 115%;
        height: 115%;
        animation-name: zombie-lurch;
        animation-duration: 2.7s;
      }

      .plant-piece.sunflower.has-asset .asset-sprite {
        width: 125%;
        height: 125%;
      }

      .plant-piece.snowpea.has-asset .asset-sprite,
      .card-icon.snowpea.has-asset .asset-sprite {
        border-radius: 50%;
        clip-path: circle(42% at 50% 50%);
      }

      .zombie-piece.bucket.has-asset .asset-sprite {
        width: 86%;
        height: 86%;
        animation: none;
        transform: translateY(2px) translateZ(0);
      }

      .plant-piece {
        width: 52px;
        height: 52px;
        top: 9px;
        border: 3px solid #35513f;
        border-radius: 50%;
        background: #55bd70;
      }

      .plant-piece.flower {
        background: var(--star);
      }

      .plant-piece.wall {
        border-radius: 8px;
        background: #c7975f;
      }

      .plant-piece.bubble {
        background: var(--bubble);
      }

      .plant-piece.spring {
        border-radius: 8px;
        background: #9be063;
      }

      .plant-piece.sunflower,
      .plant-piece.peashooter,
      .plant-piece.wallnut,
      .plant-piece.snowpea,
      .plant-piece.potatomine {
        font-size: 0;
      }

      .plant-piece.sunflower {
        border-color: #6d4822;
        background:
          radial-gradient(circle, #70461f 0 34%, transparent 35%),
          repeating-conic-gradient(#ffd65f 0 17deg, #f1a33a 17deg 34deg);
      }

      .plant-piece.sunflower::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 19px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #251b12;
        box-shadow: 13px 0 0 #251b12;
      }

      .plant-piece.sunflower::after {
        content: "";
        position: absolute;
        left: 19px;
        top: 31px;
        width: 15px;
        height: 7px;
        border-bottom: 3px solid #251b12;

      @media (prefers-reduced-motion: reduce) {

      <p class="review-note">UI 原型：用于确认布局和视觉方向，暂不包含真实游戏逻辑。</p>
    </main>

    <script>
      const screens = document.querySelectorAll("[data-screen]");
      const modalLayer = document.querySelector("[data-modal-layer]");
      const modalPanels = document.querySelectorAll("[data-modal-panel]");

      function showScreen(name) {
        screens.forEach((screen) => {
          screen.classList.toggle("is-active", screen.dataset.screen === name);
        });
        closeModal();
      }

      function showModal(name) {
        modalLayer.classList.add("is-visible");
        modalPanels.forEach((panel) => {
          panel.classList.toggle("is-visible", panel.dataset.modalPanel === name);
        });
      }

      function closeModal() {
        modalLayer.classList.remove("is-visible");
        modalPanels.forEach((panel) => panel.classList.remove("is-visible"));
      }

      document.addEventListener("click", (event) => {
        const goButton = event.target.closest("[data-go]");
        if (goButton) {
          showScreen(goButton.dataset.go);
          return;
        }

        const modalButton = event.target.closest("[data-modal]");
        if (modalButton) {
          showModal(modalButton.dataset.modal);
          return;
        }

        const closeButton = event.target.closest("[data-close-modal]");
        if (closeButton) {
          closeModal();
        }
      });

      document.querySelectorAll(".segments").forEach((group) => {
        group.addEventListener("click", (event) => {
          const button = event.target.closest(".segment");
          if (!button) return;
          group.querySelectorAll(".segment").forEach((item) => item.classList.remove("is-selected"));
          button.classList.add("is-selected");
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (modalLayer.classList.contains("is-visible")) {
            closeModal();
          } else {
            showModal("pause");
          }
        }
      });
    </script>
  </body>
